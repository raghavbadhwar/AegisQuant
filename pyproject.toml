[project]
name = "aegisquant-os"
version = "0.1.0"
description = "Evidence-first investment research and paper-trading operating system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "temporalio[pydantic]==1.31.0",
  "uvicorn[standard]==0.52.1",
]

[project.scripts]
run-fixture-case = "aegisquant.fixture_case:main"

[dependency-groups]
dev = [
  "hypothesis==6.165.2",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "ruff==0.16.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisquant"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aegisquant"]
