    display_name: Fundamental Quality
    weight: 1.0
    models:
      - name: fundamental-specialist-v1
        provider: replay
  - name: event-momentum
    display_name: Event and Momentum
    weight: 1.0
    models:
      - name: quant-specialist-v1
        provider: replay
  - name: behavioral-overlay
    display_name: Behavioral Overlay
    weight: 0.5
