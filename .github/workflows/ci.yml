name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check aegis apps tests scripts/generate_demo_data.py
      - run: uv run ruff format --check aegis apps tests scripts/generate_demo_data.py
      - run: uv run mypy aegis apps
      - run: uv run pytest
      - name: Replay determinism
        run: |
          uv run aegis replay demo_data/cases/nvda_earnings_case.json --ledger /tmp/a.sqlite > /tmp/a.json
          uv run aegis replay demo_data/cases/nvda_earnings_case.json --ledger /tmp/b.sqlite > /tmp/b.json
          cmp /tmp/a.json /tmp/b.json
